# PostgreSQL (perfil por defecto). Crea antes la base con database/postgres/01_crear_base_datos.sql (Navicat)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dinoglosario}
spring.datasource.username=${DB_USER:dino}
