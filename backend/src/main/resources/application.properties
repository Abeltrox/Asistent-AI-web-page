spring.application.name=dinoglosario
server.port=8080

# Perfil por defecto: PostgreSQL (application-postgres.properties).
# Para usar H2 en archivo sin instalar nada: SPRING_PROFILES_ACTIVE=h2
spring.profiles.active=${SPRING_PROFILES_ACTIVE:postgres}

# ---------- Base de datos (H2 en archivo; el perfil postgres la reemplaza) ----------
spring.datasource.url=jdbc:h2:file:./data/dinoglosario;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- Subida de archivos ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.uploads.dir=./uploads

# ---------- Seguridad ----------
# Cambia este secreto en producción (mínimo 32 caracteres) o usa la variable de entorno JWT_SECRET
app.jwt.secret=${JWT_SECRET:cambia-este-secreto-super-largo-para-dinoglosario-2026}
app.jwt.expiracion-minutos=480
# Código que debe presentar quien se registre como paleontólogo (administrador)
app.paleontologo.codigo-acreditacion=${CODIGO_PALEONTOLOGO:PALEO-2026}

# ---------- Asistente IA (servicio Python RAG) ----------
app.asistente.url=${ASISTENTE_URL:http://localhost:8000}

# ---------- Datos de ejemplo ----------
app.seed.enabled=true
